# Dependabot version updates are disabled on purpose.
#
# This repository is a mirror of an upstream project. Nothing is released from
# here, so dependency bumps opened against it are never merged; they only bury
# real pull requests. Dependency updates are taken from upstream.
#
# Every update entry is kept with `open-pull-requests-limit: 0`, which is the
# documented way to stop version-update PRs. An earlier `updates: []` did not
# stop the runs (Dependabot kept opening PRs from the previous configuration).
version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/.ci"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
